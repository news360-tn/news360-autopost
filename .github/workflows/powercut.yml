name: powercut
# Namakkal 360 / Rasipuram 360 - owner 1 Nov: POWER-SHUTDOWN news is posted at once (as for Coimbatore 360). Every hour 5:50 AM -
# 9:50 PM IST: Dinamani + Dinamalar Namakkal pages are checked for power-cut notices whose cut day is today (not over) or later; each
# new one is written, made into a reel and posted at once (the page - Rasipuram 360 or Namakkal 360 - is chosen as for every story).
# The normal 2-hourly collection, its queue and its writer go on exactly as before (this lane only writes its own links).
# The same cut is never posted twice (same day + same place), a cut that is over is never posted. A notice not on Instagram within
# 40 minutes fails this job (GitHub e-mails the owner). Paused like the collection when research_free/ENABLED is removed.
on:
  schedule:
    - cron: "20 0-16 * * *"      # 05:50 ... 21:50 IST, every hour
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = only show what would be posted (nothing written or posted)"
        default: "0"
permissions:
  contents: write
  actions: write
concurrency:
  group: namakkal-powercut
  cancel-in-progress: false
jobs:
  powercut:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POWERCUT_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry || '0' }}
      BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
      BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: claude-haiku-5-5
      CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
      CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          pip install -q requests googlenewsdecoder==0.2.2 pillow
          pip install -q opencv-contrib-python-headless==4.10.0.84 pillow-avif-plugin==1.4.6 || echo 'photo tools not installed'
      - name: Find new power-cut notices
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ ! -f research_free/ENABLED ]; then echo "collection paused (no research_free/ENABLED)"; : > /dev/null; echo "N=0" >> "$GITHUB_ENV"; echo "POWERCUT_DRY=1" >> "$GITHUB_ENV"; exit 0; fi
          mkdir -p research_free/results
          set -o pipefail
          python -u research_free/powercut.py find 2>&1 | tee research_free/results/powercut.log
          echo "N=$(grep -c . research_free/results/powercut_urls.txt || true)" >> "$GITHUB_ENV"
      - name: Write, make the reel and post at once
        if: env.POWERCUT_DRY != '1' && env.N != '0'
        env:
          PICK_ONLY: "1"
          COLLECT_MODE: both
          WRITE_STORIES: "1"
          AUTO_IMAGES: "1"
          WRITE_WORKERS: "2"
          BUDGET_MIN: "40"
          FRESH_DAYS: "2"
          DAILY_CAP: "1000"
        run: |
          urls=$(tr '\n' ' ' < research_free/results/powercut_urls.txt)
          n=$(echo $urls | wc -w)
          for TRY in 1 2; do
            MANUAL_URL="$urls" MAX_STORIES="$n" python -u research_free/collect.py >> research_free/results/powercut_write.log 2>&1 && break
            echo "writer exit $? (try $TRY)" >> research_free/results/powercut_write.log; sleep 30
          done
          tail -25 research_free/results/powercut_write.log
          gh api -X POST "repos/$GH_REPO/actions/workflows/post.yml/dispatches" -f ref=main -f "inputs[dry_run]=false" -f "inputs[prebuild]=false" >/dev/null 2>&1 || true
      - name: Save state (a notice is never written twice)
        if: always() && env.POWERCUT_DRY != '1'
        run: |
          git config user.name "news360-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f research_free/archive/powercut_state.json research_free/results/powercut.log research_free/results/powercut_write.log 2>/dev/null || true
          git commit -qm "powercut: notices written" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash origin main && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i*4)); done || true
      - name: Check every power cut is on Instagram (else post again; after 40 minutes fail loudly)
        if: env.POWERCUT_DRY != '1' && env.N != '0'
        run: |
          set -o pipefail
          for i in $(seq 1 8); do
            sleep 300
            python -u research_free/powercut.py verify 2>&1 | tee -a research_free/results/powercut.log && exit 0
            gh api -X POST "repos/$GH_REPO/actions/workflows/post.yml/dispatches" -f ref=main -f "inputs[dry_run]=false" -f "inputs[prebuild]=false" >/dev/null 2>&1 || true
          done
          echo "::error::a power-cut notice is still not posted after 40 minutes - see 'NOT POSTED' lines above"; exit 1
