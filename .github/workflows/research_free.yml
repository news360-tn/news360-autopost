name: research-free
# every 4 hours (IST 05:30, 09:30, 13:30, 17:30, 21:30, 01:30; often a little late). Runs ONLY while research_free/ENABLED exists (Actions -> collect-switch -> start/pause). Every round collects, writes the new stories
# (quality-checked) and sends ONE images-needed e-mail - only when there is news. Stories still waiting for images from an earlier round are listed again in it.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "dry run (do not write to Sheet / send email)"
        default: "false"
permissions:
  contents: write
concurrency: research-free
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Check switch
        id: sw
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ ! -f research_free/ENABLED ]; then echo "go=no" >> $GITHUB_OUTPUT; else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-python@v5
        if: steps.sw.outputs.go == 'yes'
        with: {python-version: "3.11"}
      - run: pip install requests googlenewsdecoder pillow
        if: steps.sw.outputs.go == 'yes'
      - name: Collect, write, validate, send
        if: steps.sw.outputs.go == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
          CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
          BUDGET_MIN: "55"
          AUTO_IMAGES: "1"          # owner request 24 Oct: images made automatically (Cloudflare FLUX, then NVIDIA FLUX.1-dev); stories without all images go to the e-mail as before
          WRITE_STORIES: '1'
        run: |
          mkdir -p research_free/results
          FLAG=""; [ "${{ github.event.inputs.dry }}" = "true" ] && FLAG="--dry"
          for TRY in 1 2; do
            python -u research_free/collect.py $FLAG > research_free/results/collect.log 2>&1 && break
            echo "exit $? (try $TRY)" >> research_free/results/collect.log
            cp research_free/results/collect.log research_free/results/collect_failed.log
            sleep 60
          done
          tail -15 research_free/results/collect.log
      - name: Save log
        if: always() && steps.sw.outputs.go == 'yes'
        run: |
          git config user.name "news360-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f research_free/results research_free/archive
          git commit -m "free collector log" || echo none
          git pull --rebase --autostash origin main || true
          git push || true
      - name: Fail loudly if the collector crashed (GitHub then emails the repo owner)
        if: steps.sw.outputs.go == 'yes'
        run: |
          if grep -q "Traceback" research_free/results/collect.log; then echo "collector crashed twice"; exit 1; fi
