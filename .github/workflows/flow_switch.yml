name: collect-switch
# ONE-CLICK PAUSE / START of the automatic news collection + writing (the free-model / Claude job).
# Posting is NOT touched: stories you send by e-mail (subject "NEWS360 STORY") and stories already queued keep being posted.
# Use: GitHub -> Actions -> "collect-switch" -> Run workflow -> choose pause or start.
on:
  workflow_dispatch:
    inputs:
      collect:
        description: "pause = stop automatic collecting/writing (you send the news yourself)  |  start = automatic collecting again"
        type: choice
        options: [pause, start]
        default: pause
permissions:
  contents: write
concurrency: collect-switch
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set switch
        run: |
          if [ "${{ github.event.inputs.collect }}" = "start" ]; then echo on > research_free/ENABLED; date -u +%Y-%m-%dT%H:%M:%SZ > research_free/START_AT; else rm -f research_free/ENABLED; fi
          git config user.name "news360-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A research_free
          git commit -m "collect switch: ${{ github.event.inputs.collect }}" || echo "no change"
          git pull --rebase origin main && git push || true
          if [ -f research_free/ENABLED ]; then echo "### Automatic collecting: ON" >> $GITHUB_STEP_SUMMARY; else echo "### Automatic collecting: PAUSED (posting continues)" >> $GITHUB_STEP_SUMMARY; fi
