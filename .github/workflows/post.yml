name: Post stories (carousel + reel)

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes: look for stories whose images you have sent
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only (build + upload, do not post to Instagram)"
        type: boolean
        default: true
      prebuild:
        description: "Prebuild only: make every waiting carousel + reel now and keep them ready; nothing is posted (set dry_run to false). The next posting run publishes them at once."
        type: boolean
        default: false

concurrency:
  group: news360-post
  cancel-in-progress: false

permissions:
  contents: write
  actions: write      # the watchdog restarts an overdue news collection / story writer

env:
  GH_MEDIA_TOKEN: ${{ github.token }}      # owner 24 Nov: Cloudinary refused -> the file is kept in this repository (poster/githost.py)
  BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
  BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
  PROMO_URL: ${{ secrets.PROMO_URL || 'https://script.google.com/macros/s/AKfycbxwMsz3A3kYGIRzrqJ7SS2Yfu-d0kR2zv4DBp8iWS3N3Ax3QEJ6KQxN69XtCTi2qvVF/exec' }}      # owner 20 Nov: approved promotion ads (poster/promo.py) - nothing happens without it
  PROMO_KEY: ${{ secrets.PROMO_KEY }}
  CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
  CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
  CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}      # owner 12 Nov: clean-up of old files (poster/cloudclean.py)
  CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FAL_KEY: ${{ secrets.FAL_KEY }}
  TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
  POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # picture check: does the AI image show the news?
  SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}      # owner 30 Oct: free writers (skipped until the key is set)
  FB_PAGE_ID_NAMAKKAL: ${{ secrets.FB_PAGE_ID_NAMAKKAL }}      # owner 2 Nov: the same reels also go to the Facebook pages
  FB_TOKEN_NAMAKKAL: ${{ secrets.FB_TOKEN_NAMAKKAL }}
  FB_PAGE_ID_RASIPURAM: ${{ secrets.FB_PAGE_ID_RASIPURAM }}
  FB_TOKEN_RASIPURAM: ${{ secrets.FB_TOKEN_RASIPURAM }}
  # owner 21 Nov: YouTube auto upload - a page uploads only when its 3 YT_* secrets exist
  YT_CLIENT_ID_NAMAKKAL: ${{ secrets.YT_CLIENT_ID_NAMAKKAL }}
  YT_CLIENT_SECRET_NAMAKKAL: ${{ secrets.YT_CLIENT_SECRET_NAMAKKAL }}
  YT_REFRESH_TOKEN_NAMAKKAL: ${{ secrets.YT_REFRESH_TOKEN_NAMAKKAL }}
  YT_CLIENT_ID_RASIPURAM: ${{ secrets.YT_CLIENT_ID_RASIPURAM }}
  YT_CLIENT_SECRET_RASIPURAM: ${{ secrets.YT_CLIENT_SECRET_RASIPURAM }}
  YT_REFRESH_TOKEN_RASIPURAM: ${{ secrets.YT_REFRESH_TOKEN_RASIPURAM }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
  PREBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.prebuild && '1' || '' }}
  PAUSED: ${{ vars.PAUSED }}
  DIRECT_UPLOAD: "auto"      # owner 21 Nov ("do not use Cloudinary"): reels and stories go to Instagram / Facebook as FILES once the page's Facebook token (FB_PAGE_ID_* / FB_TOKEN_*, with instagram_basic + instagram_content_publish) is set - until then the Cloudinary link as before. "0" switches it off.
  FB_GAP_MIN: "5"      # owner 23 Nov: Facebook like Instagram - the next news 5 minutes after the last (owner chose this knowing the Meta 368 risk; was 60)
  FB_TOP_PER_DAY: "20"      # owner 24 Nov: 20 Facebook news a day per page (30 brought Meta 368 blocks on Coimbatore); beyond 20 the news waits / is e-mailed

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12      # also makes the automatic pictures (max 7 min per run)
    outputs:
      ready: ${{ steps.chk.outputs.ready }}
      matrix: ${{ steps.chk.outputs.matrix }}
      more: ${{ steps.chk.outputs.more }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Is a story ready?
        id: chk
        run: |
          if [ -z "$BRIDGE_URL" ]; then   # posting is never paused: e-mailed and queued reels always post
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "Setup not finished. BRIDGE_URL_set=[${BRIDGE_URL:+yes}]" | tee .last_check
          else
            pip install -q requests==2.32.5 pillow==11.3.0
            pip install -q opencv-contrib-python-headless==4.10.0.84 pillow-avif-plugin==1.4.6 || echo 'photo tools not installed'      # owner 31 Oct: real news photos
            set +e; python poster/post.py check 2>&1 | tee .last_check; CHECK_RC=${PIPESTATUS[0]}; set -e      # owner 2 Nov: a crash must not look green
            n=$(grep -oE "ready to post: [0-9]+" .last_check | grep -oE "[0-9]+" | head -1); if [ "${n:-0}" -gt 0 ] || grep -qE "auto images: (time for this run used up|credit cap)" .last_check; then echo "more=1" >> "$GITHUB_OUTPUT"; fi      # owner 16 Nov: news still waiting - this run starts the next one
          fi
          git config user.name "news360-bot"; git config user.email "news360-bot@users.noreply.github.com"
          if grep -q "ready to post: [1-9]" .last_check || [ "$(date -u +%M)" -lt 5 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then git add -f .last_check && git commit -qm "check log" && { for i in 1 2 3 4; do git pull -q --rebase -X theirs --autostash && git push -q && break; git rebase --abort 2>/dev/null || true; sleep $((i*3)); done; } || true; fi
          # owner 1 Nov: the list of posts already shared to the story (never twice) is saved after every check
          [ -f poster/story_shared.json ] && git add -f poster/story_shared.json; for f in poster/prebuilt/_ig_paused_*.json poster/prebuilt/_direct_*.json; do [ -f "$f" ] && git add -f "$f"; done; [ -d poster/fb_posted ] && git add -f poster/fb_posted; [ -f poster/manual_sent.json ] && git add -f poster/manual_sent.json; [ -f poster/dashboard_status.json ] && git add -f poster/dashboard_status.json; [ -d poster/yt_uploaded ] && git add -f poster/yt_uploaded; git diff --cached --quiet || { git commit -qm "stories shared / Instagram pause" && { for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash && git push -q && break; git rebase --abort 2>/dev/null || true; sleep $((i*3)); done; } || true; }      # owner 21 Nov: a pause made by the story catch-up is kept too
          if [ "${CHECK_RC:-0}" != "0" ]; then echo "::error::post.py check crashed (exit $CHECK_RC) - nothing was posted in this run"; exit 1; fi
      - name: Facebook - try failed reels again (at most 2 more times, within 24 h)
        if: always() && env.BRIDGE_URL != '' && env.DRY_RUN == ''
        continue-on-error: true
        timeout-minutes: 12
        run: |
          [ -n "$(ls poster/fb_posted 2>/dev/null)" ] || exit 0
          pip install -q requests==2.32.5
          python poster/facebook.py retry
          git config user.name "news360-bot"; git config user.email "news360-bot@users.noreply.github.com"
          git add -f poster/fb_posted && git commit -qm "facebook retry" && { for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash && git push -q && break; git rebase --abort 2>/dev/null || true; sleep $((i*3)); done; } || true
      - name: Watchdog - restart an overdue collection or writer (GitHub sometimes skips scheduled runs)
        if: always() && github.event_name == 'schedule' && env.BRIDGE_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f research_free/ENABLED ] || { echo "collecting is paused (no research_free/ENABLED)"; exit 0; }
          python3 - <<'PY' > /tmp/wd.txt
          import json, datetime as d
          now = d.datetime.now(d.timezone.utc)
          try: last = json.load(open("research_free/archive/last_run.json"))
          except Exception: last = {}
          def age(k):
              try: return (now - d.datetime.fromisoformat(last[k])).total_seconds() / 60
              except Exception: return 1e9
          try: q = len(json.load(open("research_free/archive/queue.json")))
          except Exception: q = 0
          print("collect" if age("collect") > 255 else "", "write" if q and age("write") > 30 else "")
          print(f"last collect {age('collect'):.0f} min ago, last write {age('write'):.0f} min ago, queue {q}")
          PY
          cat /tmp/wd.txt
          todo=$(head -1 /tmp/wd.txt)
          case "$todo" in *collect*) gh workflow run research_free.yml -f dry=false && echo "news collection was overdue: started now";; esac
          case "$todo" in *write*) gh workflow run write_stories.yml && echo "queued news waiting: story writer started now";; esac
          true
      - name: Keep the schedule alive (daily heartbeat)
        if: always() && github.event_name == 'schedule' && env.BRIDGE_URL != ''
        run: |
          if [ "$(date -u +%H)" = "18" ] && [ "$(date -u +%M)" -lt 20 ]; then
            date -u +"%Y-%m-%d %H:%M UTC" > .heartbeat
            git config user.name "news360-bot"
            git config user.email "news360-bot@users.noreply.github.com"
            git add .heartbeat && git commit -m "Heartbeat" && git push || true
          fi

  post:
    needs: check
    if: needs.check.outputs.ready == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
    env:
      TA_MODEL: ${{ github.workspace }}/reel/models/ta
      SLOT_MIN: ${{ matrix.slot }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}      # owner 30 Oct: free writers (skipped until the key is set)
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      WEBSITE_INGEST_KEY: ${{ secrets.WEBSITE_INGEST_KEY }}      # posted stories go to www.namakkal360.workers.dev      # Google human-like voice for every second story (reel_voice_alt)
      MANUAL: ${{ matrix.manual || '' }}      # owner 22 Nov: e-mail the reel for a manual post instead of posting
      MANUAL_PAGE: ${{ matrix.page || '' }}
      PREBUILD: ${{ matrix.prebuild || (github.event_name == 'workflow_dispatch' && inputs.prebuild && '1' || '') }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reel/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tamil voice model (cached)
        id: model
        uses: actions/cache@v4
        with:
          path: reel/models/ta
          key: indic-tts-ta-v1
      - name: Download voice model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p reel/models
          curl -sL -o /tmp/ta.zip https://github.com/AI4Bharat/Indic-TTS/releases/download/v1-checkpoints-release/ta.zip
          unzip -q /tmp/ta.zip -d reel/models && rm /tmp/ta.zip
          ls reel/models/ta
      - name: Browser (cached)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ hashFiles('reel/requirements.txt') }}
      - name: Install
        timeout-minutes: 25      # normally 2 min; a stuck download (26 Oct: 20+ min) must not block posting for 90 min
        run: |
          # ffmpeg: fast copy from GitHub (fingerprint checked), Ubuntu only as the backup - 26 Oct: Ubuntu mirrors hung apt for 30 min
          ffmpeg_github() {
            U=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
            line=$(curl -sfL --max-time 30 $U/checksums.sha256 | grep -E '  ffmpeg-n[0-9.]+-latest-linux64-gpl-[0-9.]+\.tar\.xz$' | sort -k2 -V | tail -1) &&
            [ -n "$line" ] && f=${line##* } && cd /tmp &&
            curl -sfL --max-time 180 --retry 2 -o "$f" "$U/$f" && echo "$line" | sha256sum -c --quiet - &&
            tar xf "$f" && sudo cp /tmp/ffmpeg-*/bin/ffmpeg /tmp/ffmpeg-*/bin/ffprobe /usr/local/bin/ && cd - >/dev/null &&
            ffmpeg -hide_banner -version | head -1
          }
          ffmpeg_ubuntu() {
            sudo dpkg --configure -a 2>/dev/null || true
            sudo apt-get $APT update -qq && sudo apt-get $APT install -y -qq ffmpeg
          }
          browser_ok() { python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); p.chromium.launch().close(); p.stop()"; }
          inst() {
            APT="-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3"
            { command -v ffmpeg >/dev/null || ffmpeg_github || { echo "GitHub ffmpeg failed - using Ubuntu"; ffmpeg_ubuntu; }; } &&
            pip install --timeout 60 torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu &&
            pip install --timeout 60 -r reel/requirements.txt &&
            python -m playwright install chromium &&
            { browser_ok || { echo "browser needs system parts - using Ubuntu"; sudo "$(command -v python)" -m playwright install-deps chromium; }; } &&
            (cd kit && npm install --no-audit --no-fund)
          }
          for i in 1 2; do
            timeout 600 bash -c "$(declare -f inst ffmpeg_github ffmpeg_ubuntu browser_ok); inst" && exit 0
            echo "install attempt $i stuck or failed - trying again"
          done
          exit 1
      - name: Build and post the carousel and the reel
        run: python poster/post.py run ${{ matrix.story }}
      - name: Keep the finished files (so a retry or the next run does not rebuild)
        if: always()
        run: |
          git config user.name "news360-bot"; git config user.email "news360-bot@users.noreply.github.com"
          if [ -n "$(ls poster/prebuilt 2>/dev/null)" ]; then
            git add -f poster/prebuilt && git commit -qm "prebuilt ${{ matrix.story }}" || true
          fi
          if [ -f poster/manual_sent.json ]; then git add -f poster/manual_sent.json && git commit -qm "manual post e-mail ${{ matrix.story }}" || true; fi      # owner 22 Nov
          if [ -n "$(ls poster/posted 2>/dev/null)" ]; then git add -f poster/posted && git commit -qm "posted ${{ matrix.story }}" || true; fi      # owner 21 Nov: read by the posted report
          # owner 2 Nov: the Facebook record (posted / failed) - a reel is never posted to Facebook twice
          if [ -n "$(ls poster/fb_posted 2>/dev/null)" ]; then git add -f poster/fb_posted && git commit -qm "facebook ${{ matrix.story }}" || true; fi
          if [ -n "$(git log origin/main..HEAD --oneline 2>/dev/null)" ]; then
            for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash && git push -q && break; git rebase --abort 2>/dev/null || true; sleep 5; done
          fi

  again:      # owner 16 Nov: GitHub skips most scheduled runs - a live run starts the next one (owner 18 Nov: always, the whole day),
              # and its watchdog starts rasipalan (6:40), gold (9:40), the afternoon gold check (15:40) and an overdue news round
    needs: [check, post]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Get the watchdog
        if: env.DRY_RUN == '' && env.PREBUILD == ''
        uses: actions/checkout@v4
        with:
          sparse-checkout: poster/watchdog.py
          sparse-checkout-cone-mode: false
      - name: Wait, run the watchdog, start the next live posting check
        if: env.DRY_RUN == '' && env.PREBUILD == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.check.outputs.more }}" = "1" ]; then sleep 120; else sleep 420; fi      # owner 23 Nov: more news ready - the next one about 5 minutes after this post (the 5-minute gap is kept by the check)
          python3 poster/watchdog.py || echo "watchdog failed (posting goes on)"
          # owner 20 Nov: tried 3 times - one GitHub error (HTTP 500, Trichy 20 Nov 14:09) must not stop the posting loop
          for i in 1 2 3; do gh api -X POST "repos/${{ github.repository }}/actions/workflows/post.yml/dispatches" -f ref=main -F "inputs[dry_run]=false" && { echo "next posting run started"; break; }; [ $i = 3 ] && echo "::warning::next run not started after 3 tries (the 5-minute schedule still runs)"; sleep $((i*20)); done
