name: context
# keeps PROJECT_CONTEXT.md "Recent changes" up to date after every code commit (bot log/queue saves do not trigger it)
on:
  push:
    branches: [main]
    paths: ["**.py", "**.gs", "**.md", "poster/config.json", ".github/workflows/**", "!PROJECT_CONTEXT.md"]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: context, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 400 }
      - run: python3 tools/update_context.py
      - name: Save
        run: |
          git diff --quiet PROJECT_CONTEXT.md && { echo "no change"; exit 0; }
          git config user.name "news360-bot"; git config user.email "bot@users.noreply.github.com"
          git add PROJECT_CONTEXT.md && git commit -m "context: recent changes updated"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; git rebase --abort 2>/dev/null; sleep $((i*4)); done
