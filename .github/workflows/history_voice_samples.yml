name: history-voice-samples
# owner 26 Nov: the SAME Tamil history narration in several voices (Sarvam, free Edge voices, other Google Chirp voices) so the owner can LISTEN
# once and pick the history voice. Writes samples/history_voices/*.mp3 (committed). Posts nothing. Claude cannot hear audio - the owner decides.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests==2.32.5 edge-tts==7.2.3 imageio-ffmpeg==0.6.0 numpy
      - run: python history/history_voice.py samples
      - name: Commit the samples
        run: |
          git config user.name "news360-bot"; git config user.email "news360-bot@users.noreply.github.com"
          git add -f samples/history_voices
          git commit -qm "history voice samples" || echo none
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
