name: Carousel posts (hourly)

on:
  schedule:
    - cron: "40 * * * *"   # every hour at :40 UTC (= :10 IST), after the Claude news check
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only (render + upload, do not post)"
        type: boolean
        default: true

concurrency:
  group: news360-carousel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
      BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
      CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
      CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
      PAUSED: ${{ vars.PAUSED }}
    steps:
      - uses: actions/checkout@v4
      - name: Paused?
        if: env.PAUSED == 'true'
        run: echo "Posting is paused (repository variable PAUSED=true)." && exit 0
      - uses: actions/setup-python@v5
        if: env.PAUSED != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: poster/requirements.txt
      - uses: actions/setup-node@v4
        if: env.PAUSED != 'true'
        with:
          node-version: "20"
      - name: Install
        if: env.PAUSED != 'true'
        run: |
          pip install -r poster/requirements.txt
          python -m playwright install --with-deps chromium
          cd kit && npm install --no-audit --no-fund
      - name: Post carousels
        if: env.PAUSED != 'true'
        run: python poster/post.py carousel
      - name: Keep the schedule alive (daily heartbeat)
        if: env.PAUSED != 'true' && github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = "18" ]; then
            date -u +"%Y-%m-%d %H:%M UTC" > .heartbeat
            git config user.name "news360-bot"
            git config user.email "news360-bot@users.noreply.github.com"
            git add .heartbeat && git commit -m "Heartbeat" && git push || true
          fi
