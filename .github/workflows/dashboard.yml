name: dashboard
# owner 26 Nov: the READ-ONLY collector for the private team dashboard (dashboard/). It only reads the numbers the pages already keep in
# their public repositories + the public YouTube numbers, and sends them to the dashboard's private store. It changes nothing in the
# posting workflows, commits nothing, and never turns red: without DASH_URL / DASH_WRITE_KEY it does nothing.
on:
  schedule:
    - cron: "25 */3 * * *"      # every 3 hours
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DASH_URL: ${{ secrets.DASH_URL }}
      DASH_WRITE_KEY: ${{ secrets.DASH_WRITE_KEY }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests==2.32.5
      - run: python dashboard/dash_collect.py
