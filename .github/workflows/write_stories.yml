name: write-stories
# every 20 minutes: takes the news queue (filled every 4 hours by research-free), highest priority first, writes the story
# (quality-checked, pictures made) and starts the posting job at once. Runs ONLY while research_free/ENABLED exists.
# An empty queue ends the run in seconds.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write      # starts the posting job as soon as a story is saved
concurrency: research-free-write      # owner 29 Oct: own queue (it used to cancel waiting collections); it skips its round while a collection runs
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Check switch and queue
        id: sw
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          go=yes
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/research_free.yml/runs?status=in_progress" -q '.total_count' 2>/dev/null || echo 0)
          q=$(gh api "repos/${{ github.repository }}/actions/workflows/research_free.yml/runs?status=queued" -q '.total_count' 2>/dev/null || echo 0)
          if [ "${n:-0}" != "0" ] || [ "${q:-0}" != "0" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # 29 Oct: the collector starts this writer just before it saves the queue - wait for it (max 12 min) and read the new queue
              for i in $(seq 1 24); do
                n=$(gh api "repos/${{ github.repository }}/actions/workflows/research_free.yml/runs?status=in_progress" -q '.total_count' 2>/dev/null || echo 0)
                [ "${n:-0}" = "0" ] && break
                echo "collection still saving - waiting ($i)"; sleep 30
              done
              git pull -q origin main || true
            else
              go=no; echo "collection is running - the writer skips this round"
            fi
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ ! -f research_free/ENABLED ]; then go=no; fi
          if [ ! -s research_free/archive/queue.json ] || [ "$(tr -d '[:space:]' < research_free/archive/queue.json)" = "[]" ]; then go=no; echo "queue empty"; fi
          echo "go=$go" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.sw.outputs.go == 'yes'
        with: {python-version: "3.11"}
      - run: pip install requests googlenewsdecoder==0.2.2 pillow
        if: steps.sw.outputs.go == 'yes'
      - name: Write the queued news by priority, save each story, start posting
        if: steps.sw.outputs.go == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
          CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COLLECT_MODE: write
          BUDGET_MIN: "30"
          AUTO_IMAGES: "1"
          WRITE_STORIES: '1'
          WRITE_WORKERS: "3"
          FRESH_DAYS: "2"
        run: |
          mkdir -p research_free/results
          python -u research_free/collect.py > research_free/results/write.log 2>&1 || echo "exit $?" >> research_free/results/write.log
          tail -15 research_free/results/write.log
      - name: Save the queue and log
        if: always() && steps.sw.outputs.go == 'yes'
        run: |
          git config user.name "news360-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f research_free/results research_free/archive
          git commit -m "story writer log" || echo none
          for i in 1 2 3 4 5; do git pull --rebase -X theirs --autostash origin main && git push && break; git rebase --abort 2>/dev/null; sleep $((i*4)); done || true
      - name: Fail loudly if the writer crashed (GitHub then emails the repo owner)
        if: steps.sw.outputs.go == 'yes'
        run: |
          if grep -q "Traceback" research_free/results/write.log; then echo "writer crashed"; exit 1; fi
