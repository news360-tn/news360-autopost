name: imagegen-test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pillow
      - name: Generate test images with NVIDIA
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p research_free/results/img
          timeout 400 python -u research_free/imagegen.py research_free/results/img/t1.jpg > research_free/results/img/log.txt 2>&1 || echo "exit $?" >> research_free/results/img/log.txt
          timeout 500 python -u research_free/imgcompare.py >> research_free/results/img/log.txt 2>&1 || true
          python - >> research_free/results/img/log.txt 2>&1 <<'PY'
          from PIL import Image
          import glob
          for f in glob.glob("research_free/results/img/*.jpg"):
              print(f, Image.open(f).size)
          PY
      - name: Commit results
        if: always()
        run: |
          git config user.name "news360-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f research_free/results/img
          git commit -m "image test output" || echo none
          git pull --rebase --autostash origin main
          git push
