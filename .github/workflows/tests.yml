name: tests
# regression tests from real cases the pipeline got wrong (tests/test_regressions.py). Runs when code or settings change - not for
# the bot's log / queue saves. A failure means an old problem has come back; GitHub then e-mails the repo owner.
on:
  push:
    branches: [main]
    paths: ["**.py", "poster/config.json", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests==2.32.5 pillow==11.3.0 googlenewsdecoder==0.2.2 pyflakes==3.2.0 pyswisseph==2.10.3.2      # owner 30 Oct: undefined names (the 29 Oct posting crash) fail here, before going live
      - name: Regression tests
        run: python -m unittest discover -s tests -v
